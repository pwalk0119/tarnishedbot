name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests must never call the Claude API or download embedding models.
      ANTHROPIC_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      # setup-uv has no floating major tag (v8+), so pin an exact release.
      # Its default enable-cache ("auto") caches on push/PR runs.
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

      - name: Guide entries check
        run: uv run python -m pipeline.guide_check
